[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[project.urls]
Homepage = "https://github.com/Narodomy/Time-Series-Generative-AI-for-Asset-Investment"
Issues = "https://github.com/Narodomy/Time-Series-Generative-AI-for-Asset-Investment/issues"

[project]
name = "tsa-genai"
version = "0.2.0"
description = "Time Series Generative AI for Asset Investment."
authors = [
    { name = "Narodom Yatnimit", email = "narodomy@outlook.com" }
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11.0"
dependencies = [
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "scikit-learn>=1.7.0",
    "scipy>=1.16.0",
]

[project.optional-dependencies]
data = ["pyarrow>=22.0.0", "pandas-datareader"]
viz = ["matplotlib>=3.10.0", "seaborn>=0.13.0", "plotly>=6.3.0"]
finance = ["statsmodels>=0.14.0", "yfinance>=0.2.65", "quantstats", "pyportfolioppt", "ta-lib"]
utils = ["requests>=2.32.0", "lxml>=6.0.0", "beautifulsoup4>=4.13.0", "tqdm>=4.67.0"]
dev = ["ipykernel>=6.30.0"]
